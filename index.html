<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) non-zero.
         No user-scalable=no: it breaks pinch-zoom for everyone who needs it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Kept in step with the resolved theme by applyTheme() in src/lib/theme.ts.
         It colours the status bar area of the installed PWA. -->
    <meta name="theme-color" content="#fdfcf9" />
    <!-- Invite-only: there is no page here a stranger is meant to find, and
         being absent from search results is part of what keeps this a private
         service rather than one offered to the public. See docs/LEGAL-INPUTS.md. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>merit</title>

    <!--
      Theme bootstrap. Inline, and deliberately duplicated from src/lib/theme.ts:
      it has to run before the first paint, which means before the bundle exists,
      which means it cannot import anything. Without it every reload flashes the
      wrong theme — the most obvious quality tell in a themed app, and worse in an
      installed PWA where there is no browser chrome to distract from it.
      Storage failures (private mode, blocked storage) must never stop a theme
      from being applied. See DESIGN.md §2.5.
    -->
    <script>
      (function () {
        var theme = "light";
        try {
          var stored = localStorage.getItem("merit.theme");
          theme = stored === "light" || stored === "dark" ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        } catch (e) { theme = "light"; }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <!--
      First paint, before the bundle exists.

      `#root` used to be empty, so the first thing this document painted was
      nothing — and a browser reloading a page goes on showing the *previous*
      document until the new one paints. On a phone that is most of a second of
      either a white flash or the screen you just left, which is what made the
      app look like it was showing the wrong page on open.

      So the document paints Merit's own frame itself: the ground, a header
      rule, and the shape of a screen. React replaces all of it the moment it
      mounts. The four values below are duplicated from tokens.css for the same
      reason the theme bootstrap above is — this has to run before anything can
      be imported. They are the ground and the plane, and nothing else needs to
      be right for one frame.
    -->
    <style>
      :root { --boot-bg: #fdfcf9; --boot-plane: #f2efe8; --boot-line: #e5e0d5; }
      :root[data-theme="dark"] { --boot-bg: #0e0e0f; --boot-plane: #202124; --boot-line: #2a2b2e; }
      html, body { margin: 0; background: var(--boot-bg); }
      #boot, #boot * { box-sizing: border-box; }
      #boot { display: flex; flex-direction: column; min-height: 100dvh; }
      #boot .bar { height: 45px; border-bottom: 1px solid var(--boot-line); }
      #boot .col {
        width: 100%; max-width: 860px; margin: 0 auto;
        padding: 20px 16px; display: flex; flex-direction: column; gap: 12px;
      }
      #boot .b { background: var(--boot-plane); border-radius: 8px; }
      #boot .tabs {
        margin-top: auto; height: calc(56px + env(safe-area-inset-bottom));
        border-top: 1px solid var(--boot-line);
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot" aria-hidden="true">
        <div class="bar"></div>
        <div class="col">
          <div class="b" style="height: 16px; width: 96px"></div>
          <div class="b" style="height: 160px"></div>
          <div class="b" style="height: 96px"></div>
        </div>
        <div class="tabs"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
